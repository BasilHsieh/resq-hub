<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>ResQ Hub 設計系統</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 320px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 320px; overflow: hidden; }
  .art svg { display: block; }
  .slab { fill: var(--action); rx: var(--radius-lg); }
  .deep { fill: var(--ink); rx: var(--radius-lg); }
  .tile { rx: var(--radius-lg); }
  .known { fill: var(--action); }
  .tint { fill: var(--action-soft); }
  .signal { fill: var(--need); }
  .unknown { fill: none; stroke: var(--action); stroke-width: var(--stroke-emphasis); stroke-dasharray: 6 4; }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 88px; line-height: .95; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
  .tag { margin: var(--space-3) 0 0 2px; font-size: 14px; line-height: 20px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="480 0 480 320" width="480" height="320">
<!--
  blocks      action 216x280 slab bled off the top and right (the brand) · ink 216x56 bled off the bottom-right, a space-4 under the slab · action-soft as one merged two-wide tile (the tint) · need one tile only (the one warm hue: it only ever means 缺人) — about 26% of 960x320
  arrangement one tall slab with a 4x4 household grid beside it; grid and slab a space-4 apart
  pattern     tiles, from the README's 名單是核心、虛線＝還沒確定: control-md tiles at a control-md + space-2 pitch — ten dashed in action (尚未取得同意), three filled action (已同意), one two-wide tint, one need-fg
  scales      tile control-md 56 · gutter space-2 8 · slab gap space-4 16 · corners radius-lg 24 · dashes stroke-emphasis 2.5
-->
<rect class="slab" x="760" y="-16" width="216" height="280" rx="16"/>
<rect class="deep" x="760" y="280" width="216" height="56" rx="16"/>
<rect class="tile unknown" x="497" y="33" width="54" height="54" rx="15"/>
<rect class="tile unknown" x="561" y="33" width="54" height="54" rx="15"/>
<rect class="tile known" x="624" y="32" width="56" height="56" rx="16"/>
<rect class="tile unknown" x="689" y="33" width="54" height="54" rx="15"/>
<rect class="tile known" x="496" y="96" width="56" height="56" rx="16"/>
<rect class="tile tint" x="560" y="96" width="120" height="56" rx="16"/>
<rect class="tile unknown" x="689" y="97" width="54" height="54" rx="15"/>
<rect class="tile unknown" x="497" y="161" width="54" height="54" rx="15"/>
<rect class="tile unknown" x="561" y="161" width="54" height="54" rx="15"/>
<rect class="tile unknown" x="625" y="161" width="54" height="54" rx="15"/>
<rect class="tile signal" x="688" y="160" width="56" height="56" rx="16"/>
<rect class="tile unknown" x="497" y="225" width="54" height="54" rx="15"/>
<rect class="tile known" x="560" y="224" width="56" height="56" rx="16"/>
<rect class="tile unknown" x="625" y="225" width="54" height="54" rx="15"/>
<rect class="tile unknown" x="689" y="225" width="54" height="54" rx="15"/>
</svg>
</div>
<div class="words">
<h1 class="name">ResQ Hub<br>設計系統</h1>
<p class="tag">給災區現場的志工：太陽底下、戴著手套，一眼看懂、一下按到。</p>
</div>
</div>
</body>
</html>
