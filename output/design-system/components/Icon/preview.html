<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Icon — preview</title>
<style>html, body { margin: 0; background: var(--ground); }</style>
</head>
<body>
<div id="root"></div>
<script>
var R = window.ResQ, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(

h('div', { className: 'rq-demo' },
  h('div', { className: 'rq-demo-row' },
    ['back', 'check', 'close', 'clock', 'walk', 'directions', 'report', 'user-plus', 'users', 'info', 'lock'].map(function (n) {
      return h(R.Icon, { key: n, name: n, label: n });
    })))
);
</script>
</body>
</html>
