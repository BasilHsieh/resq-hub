<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>HouseholdRow — preview</title>
<style>html, body { margin: 0; background: var(--ground); }</style>
</head>
<body>
<div id="root"></div>
<script>
var R = window.ResQ, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(

(function () {
  var rows = [
    { address: '乙路 45 巷 6 弄 3 號', consent: 'pending', updatedAt: null, walkMinutes: 2 },
    { address: '甲街 20 號', consent: 'agreed', need: 'need', needCount: 5, updatedAt: '13:20', walkMinutes: 3 },
    { address: '甲街側溝', consent: 'public', need: 'need', needCount: 10, updatedAt: '12:20', walkMinutes: 5 },
    { address: '甲街 3 號', consent: 'agreed', need: 'unknown', updatedAt: '昨天 08:40', walkMinutes: 7 }
  ];
  function Demo() {
    var s = React.useState(0), open = s[0], setOpen = s[1];
    return h('div', { className: 'rq-demo' }, rows.map(function (r, i) {
      return h(R.HouseholdRow, Object.assign({ key: i, expanded: open === i, onSelect: function () { setOpen(open === i ? -1 : i); } }, r));
    }));
  }
  return h(Demo);
})()
);
</script>
</body>
</html>
