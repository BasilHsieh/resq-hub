name: 知識庫一致性檢查

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # kb.py 零外部相依，不需要 pip install

      - name: 一致性檢查（壞連結／缺 frontmatter／缺 citation／單向關聯／mermaid click 目標）
        run: python3 scripts/kb.py check

      - name: 索引是否為最新（改了文件卻沒重跑生成器就會擋下來）
        run: |
          python3 scripts/kb.py index
          if ! git diff --exit-code --stat; then
            echo "::error::INDEX.md / MAP.md / ARCHITECTURE.md 的 AUTO 區塊過期。請在本機跑 python3 scripts/kb.py index 後重新 commit。"
            exit 1
          fi

      # 志工頁的規則測試＝規格的例子（資料模型與狀態機 §7）。測試沒過，程式就不能改（D-18）
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 志工頁規則測試（規格的例子）
        run: node --test "output/prototype/03-志工頁/app/rules.test.js"

  # 畫面比對（D-19）：「所有狀態一次攤開」每一格截一張圖，跟 repo 裡的基準圖（screens/linux/）比。
  # 規則有測試守著，這一關守的是長相：畫面變了卻沒有一起更新基準圖，PR 就過不了。
  # 基準圖一定要用這台機器跑出來的（Mac 的字型不同），做法見 output/prototype/03-志工頁/README.md 第 5 節。
  screens:
    name: 畫面比對（所有狀態一次攤開）
    runs-on: ubuntu-24.04   # 固定版本：機器的字型或畫法一換，基準圖會全部跟著變
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/visual/package-lock.json

      - name: 固定字型（英數 Roboto、中文思源黑體，也就是 Android 手機上的樣子）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-roboto fonts-noto-cjk
          mkdir -p ~/.config/fontconfig
          cp scripts/visual/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f
          fc-match sans-serif; fc-match system-ui; fc-match "Noto Sans CJK TC"

      - name: 安裝截圖工具
        working-directory: scripts/visual
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: 比對
        working-directory: scripts/visual
        run: npx playwright test

      - name: 不一樣時：留下前後對照
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screens-diff
          path: scripts/visual/test-results
          if-no-files-found: ignore

      - name: 不一樣時：照現在的畫面產生一份新的基準圖
        if: failure()
        working-directory: scripts/visual
        run: npx playwright test --update-snapshots

      - name: 不一樣時：留下新的基準圖（確認要改，才把它放回 repo）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screens-linux
          path: output/prototype/*/screens/linux
          if-no-files-found: error
