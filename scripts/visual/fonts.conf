<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- 只給 GitHub 上的截圖比對用。把字固定下來：英文與數字用 Roboto、中文用思源黑體（繁中），
       也就是 Android 手機上的樣子。不固定的話，GitHub 的機器哪天換了預設字型，基準圖會全部跟著變。
       iPhone 的字（SF、蘋方）在 Linux 上沒有，所以基準圖不代表 iPhone 的樣子。 -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Roboto</family><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Roboto</family><family>Noto Sans CJK TC</family></prefer>
  </alias>
</fontconfig>
